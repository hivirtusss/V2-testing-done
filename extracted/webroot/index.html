<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zygisk Mode Menu Virtus V3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .backdrop {
      width: 100%;
      max-width: 420px;
      max-height: 88vh;
      background: #0d0d10;
      border: 2px solid #c62828;
      border-radius: 16px;
      box-shadow: 0 0 28px rgba(198, 40, 40, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #3a1018;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .vlogo {
      width: 38px; height: 38px; border-radius: 50%;
      background: #000000;
      border: 2px solid #c62828;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #fff; font-size: 18px;
      box-shadow: 0 0 10px rgba(198, 40, 40, 0.35);
      overflow: hidden;
    }
    .vlogo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .title { color: #ffffff; font-size: 16px; font-weight: 700; line-height: 1.2; }
    .sub { color: #888888; font-size: 11px; margin-top: 4px; }
    .search {
      width: 100%; margin-top: 10px; padding: 11px 12px;
      border-radius: 10px; border: 1px solid #8b0000;
      background: #c62828; color: #fff; font-size: 14px;
    }
    .search::placeholder { color: rgba(255,255,255,0.85); }
    .list-wrap { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 180px; }
    .row {
      display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 6px;
      border-radius: 12px; background: #161018;
      border: 2px solid transparent;
    }
    .row.selected { border-color: #c62828; background: rgba(198, 40, 40, 0.18); }
    .icon {
      width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
      background: #1a0a0e; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #c62828; font-size: 16px; overflow: hidden;
    }
    .icon img { width: 42px; height: 42px; border-radius: 11px; }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .pkg { font-size: 10px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #666; flex-shrink: 0; }
    .row.selected .dot { background: #c62828; border-color: #c62828; }
    .bar { padding: 12px 16px 16px; border-top: 1px solid #3a1018; flex-shrink: 0; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: #c62828;
      color: #fff; font-size: 15px; font-weight: 700;
    }
    .btn2 {
      margin-top: 8px; background: transparent; border: 1px solid #760000;
      color: #cccccc; font-size: 12px; padding: 9px;
    }
    .count { text-align: center; font-size: 11px; color: #aaa; margin-bottom: 8px; }
    .status { text-align: center; padding: 24px 12px; color: #888; font-size: 13px; }
    .err { color: #f77; }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="head">
      <div class="brand">
        <div class="vlogo"><img src="virtus_v_logo.png" alt="V" onerror="this.replaceWith(document.createTextNode('V'))" /></div>
        <div>
          <div class="title">Virtus Module V3</div>
          <div class="sub">Select apps → Save → reboot (bubble only on selected)</div>
        </div>
      </div>
      <input class="search" id="search" type="search" placeholder="Search installed apps..." />
    </div>
    <div class="list-wrap">
      <div id="status" class="status">Loading phone apps...</div>
      <div id="list"></div>
    </div>
    <div class="bar">
      <div class="count" id="count">0 selected</div>
      <button class="btn" id="save">Save</button>
      <button class="btn btn2" id="refresh">Refresh app list</button>
    </div>
  </div>
  <script>
    const MOD = '/data/adb/modules/zygisk_floating_menu';
    const TARGET = MOD + '/target_packages.txt';
    const PKGFILE = MOD + '/pkglist.txt';
    const BLOCKED = new Set([
      'android', 'me.weishu.kernelsu', 'com.vvb2060.kernelsu', 'com.rifsxd.ksunext',
      'me.rifsxds.ksunext', 'com.sukisu.ultra', 'com.topjohnwu.magisk', 'me.bmax.apatch',
      'io.github.mmrl', 'com.dergoogler.mmrl', 'com.dergoogler.mmrl.wx',
      'com.android.systemui', 'com.android.vending', 'com.google.android.gms',
      'com.android.settings', 'com.google.android.gsf', 'com.android.shell'
    ]);
    const SYSTEM_PREFIXES = ['com.android.', 'android.', 'com.google.android.', 'com.qualcomm.', 'com.mediatek.'];
    let selected = new Set();
    let allApps = [];

    function apis() {
      const out = [];
      if (typeof ksu !== 'undefined') out.push(ksu);
      if (typeof sukisu !== 'undefined') out.push(sukisu);
      if (typeof apatch !== 'undefined') out.push(apatch);
      if (typeof magisk !== 'undefined') out.push(magisk);
      if (typeof mmrl !== 'undefined') out.push(mmrl);
      return out;
    }

    function api() {
      const list = apis();
      return list.length ? list[0] : null;
    }

    function iconCandidates(pkg) {
      const bases = [];
      if (typeof ksu !== 'undefined') bases.push('ksu://icon/');
      if (typeof sukisu !== 'undefined') bases.push('ksu://icon/', 'sukisu://icon/');
      if (typeof apatch !== 'undefined') bases.push('apatch://icon/');
      if (typeof magisk !== 'undefined') bases.push('magisk://icon/');
      if (typeof mmrl !== 'undefined') bases.push('mmrl://icon/');
      if (!bases.length) bases.push('ksu://icon/');
      return bases.map(b => b + pkg);
    }

    function iconUrl(pkg) {
      return iconCandidates(pkg)[0];
    }

    function normExecOut(out) {
      if (out == null) return '';
      if (typeof out === 'string') {
        try {
          const j = JSON.parse(out);
          if (j && j.stdout != null) return String(j.stdout);
        } catch (e) {}
        return out;
      }
      if (out.stdout != null) return String(out.stdout);
      return String(out);
    }

    function execCmd(cmd) {
      const a = api();
      if (!a || !a.exec) return Promise.reject(new Error('Open from SukiSU → Modules → WebUI button'));
      return new Promise((resolve, reject) => {
        const cb = '__exec_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        window[cb] = (errno, stdout, stderr) => {
          delete window[cb];
          resolve(normExecOut({ stdout: stdout || '' }));
        };
        try {
          const r = a.exec(cmd, '{}', cb);
          if (r && typeof r.then === 'function') {
            delete window[cb];
            r.then(v => resolve(normExecOut(v))).catch(reject);
          }
        } catch (e) {
          delete window[cb];
          reject(e);
        }
      });
    }

    function toast(m) {
      try { const a = api(); if (a && a.toast) { a.toast(m); return; } } catch (e) {}
    }

    function parseLines(text) {
      return (text || '').split('\n').map(l => l.replace(/^package:/, '').trim()).filter(Boolean);
    }

    function isSystemPkg(p) {
      return SYSTEM_PREFIXES.some(pre => p.startsWith(pre));
    }

    function okPkg(p) {
      if (!p || p === '*' || BLOCKED.has(p) || isSystemPkg(p)) return false;
      return /^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z0-9_]+)+$/.test(p);
    }

    function uniq(arr) {
      return [...new Set(arr.filter(okPkg))];
    }

    async function fromWebCache() {
      try {
        const r = await fetch('./pkglist.txt?_=' + Date.now(), { cache: 'no-store' });
        if (r.ok) return uniq(parseLines(await r.text()));
      } catch (e) {}
      return [];
    }

    async function fromCacheFile() {
      let out = '';
      try { out = await execCmd('cat "' + PKGFILE + '" 2>/dev/null'); } catch (e) {}
      return uniq(parseLines(out));
    }

    function fromKsuApi() {
      let merged = [];
      for (const a of apis()) {
        if (!a.listPackages) continue;
        try {
          let r = a.listPackages('user');
          if (r && typeof r.then === 'function') continue;
          if (typeof r === 'string') {
            try { r = JSON.parse(r); } catch (e) { r = []; }
          }
          if (Array.isArray(r)) merged = uniq([...merged, ...r]);
        } catch (e) {}
      }
      return merged;
    }

    async function fromShell() {
      const cmds = [
        'pm list packages -3',
        'pm list packages -3 -u',
        'cmd package list packages --user 0 -3'
      ];
      let best = [];
      for (const cmd of cmds) {
        let out = '';
        try { out = await execCmd(cmd + ' 2>/dev/null'); } catch (e) {}
        const pkgs = uniq(parseLines(out));
        if (pkgs.length > best.length) best = pkgs;
      }
      return best;
    }

    async function refreshCache() {
      const cmds = [
        'pm list packages -3 2>/dev/null',
        'pm list packages -3 -u 2>/dev/null',
        'cmd package list packages --user 0 -3 2>/dev/null'
      ].join('; ');
      try {
        await execCmd('mkdir -p "' + MOD + '/webroot"');
        await execCmd('(' + cmds + ') | sed "s/^package://g" | sort -u | grep -v "^\\s*$" > "' + PKGFILE + '"');
        await execCmd('cp "' + PKGFILE + '" "' + MOD + '/webroot/pkglist.txt"');
      } catch (e) {}
    }

    async function listPackages() {
      await refreshCache();
      return uniq([
        ...fromKsuApi(),
        ...(await fromWebCache()),
        ...(await fromCacheFile()),
        ...(await fromShell())
      ]);
    }

    function getLabels(pkgs) {
      const map = {};
      const a = api();
      if (a && a.getPackagesInfo) {
        for (let i = 0; i < pkgs.length; i += 50) {
          const batch = pkgs.slice(i, i + 50);
          try {
            let info = null;
            try { info = a.getPackagesInfo(JSON.stringify(batch)); } catch (e1) {
              try { info = a.getPackagesInfo(batch); } catch (e2) {}
            }
            if (typeof info === 'string') {
              try { info = JSON.parse(info); } catch (e) {}
            }
            if (Array.isArray(info)) {
              info.forEach(p => {
                const n = p.packageName || p.package || p.pkg;
                if (!n || p.isSystem) return;
                map[n] = p.appLabel || p.label || n;
              });
            }
          } catch (e) {}
        }
      }
      pkgs.forEach(p => { if (!map[p]) map[p] = p.split('.').pop() || p; });
      return map;
    }

    async function loadSelected() {
      try {
        const t = await execCmd('cat "' + TARGET + '" 2>/dev/null || true');
        selected.clear();
        parseLines(t).forEach(p => { if (okPkg(p)) selected.add(p); });
      } catch (e) {}
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('list');
      list.innerHTML = '';
      allApps.filter(a => !q || a.label.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q)).forEach(app => {
        const row = document.createElement('div');
        row.className = 'row' + (selected.has(app.pkg) ? ' selected' : '');
        row.onclick = () => {
          if (selected.has(app.pkg)) selected.delete(app.pkg); else selected.add(app.pkg);
          document.getElementById('count').textContent = selected.size + ' selected · ' + allApps.length + ' phone apps';
          render();
        };
        const icon = document.createElement('div');
        icon.className = 'icon';
        const img = document.createElement('img');
        img.alt = app.label;
        const urls = iconCandidates(app.pkg);
        let ui = 0;
        img.onerror = () => {
          ui++;
          if (ui < urls.length) { img.src = urls[ui]; return; }
          img.remove();
          icon.textContent = (app.label || app.pkg).charAt(0).toUpperCase();
        };
        img.src = urls[0];
        icon.appendChild(img);
        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = '<div class="name">' + app.label + '</div><div class="pkg">' + app.pkg + '</div>';
        const dot = document.createElement('div');
        dot.className = 'dot';
        row.appendChild(icon);
        row.appendChild(info);
        row.appendChild(dot);
        list.appendChild(row);
      });
      document.getElementById('status').style.display = 'none';
    }

    async function save() {
      const lines = [...selected].filter(okPkg);
      await execCmd('mkdir -p "' + MOD + '"');
      if (!lines.length) {
        await execCmd(': > "' + TARGET + '"');
      } else {
        await execCmd("cat > '" + TARGET + "' << 'EOF'\n" + lines.join('\n') + "\nEOF");
      }
      await execCmd('chmod 644 "' + TARGET + '"');
      toast('Saved ' + lines.length + ' apps. Reboot now.');
      document.getElementById('count').textContent = lines.length + ' saved — reboot phone';
    }

    async function boot() {
      try {
        const a = api();
        if (a && a.fullScreen) a.fullScreen(true);
        if (a && a.enableEdgeToEdge) a.enableEdgeToEdge(true);
        await loadSelected();
        document.getElementById('status').textContent = 'Loading phone apps...';
        const pkgs = await listPackages();
        const labels = getLabels(pkgs);
        allApps = pkgs.map(p => ({ pkg: p, label: labels[p] || p }));
        allApps.sort((x, y) => x.label.localeCompare(y.label));
        document.getElementById('count').textContent = selected.size + ' selected · ' + allApps.length + ' phone apps';
        if (!allApps.length) {
          document.getElementById('status').className = 'status err';
          document.getElementById('status').textContent = 'No user apps found — tap Refresh';
        } else {
          render();
        }
      } catch (e) {
        document.getElementById('status').className = 'status err';
        document.getElementById('status').textContent = e.message || String(e);
      }
    }

    document.getElementById('search').oninput = render;
    document.getElementById('save').onclick = () => save().catch(e => toast(e.message || String(e)));
    document.getElementById('refresh').onclick = boot;
    boot();
  </script>
</body>
</html>
