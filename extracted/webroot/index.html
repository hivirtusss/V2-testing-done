<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zygisk Mode Virtus V3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; }
    body { font-family: sans-serif; color: #eee; display: flex; align-items: flex-end; justify-content: center; }
    .sheet {
      width: 100%; max-height: 50vh; background: #0d0d10;
      border-radius: 14px 14px 0 0; border-top: 2px solid #c41e3a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .head { padding: 12px 14px 8px; border-bottom: 1px solid #3a1018; flex-shrink: 0; }
    .title { color: #ff0033; font-size: 16px; font-weight: 700; }
    .sub { color: #888; font-size: 11px; margin-top: 4px; }
    .search {
      width: 100%; margin-top: 8px; padding: 10px 12px;
      border-radius: 8px; border: 1px solid #5a1a28; background: #1a0a0e; color: #fff; font-size: 14px;
    }
    .list-wrap { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .row {
      display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 6px;
      border-radius: 10px; background: #161018; border: 2px solid transparent;
    }
    .row.selected { border-color: #ff0033; background: rgba(255,0,51,0.15); }
    .row img { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .pkg { font-size: 10px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #666; flex-shrink: 0; }
    .row.selected .dot { background: #ff0033; border-color: #ff0033; }
    .bar { padding: 10px 14px 14px; border-top: 1px solid #3a1018; flex-shrink: 0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #ff0033; color: #fff; font-size: 15px; font-weight: 700; }
    .count { text-align: center; font-size: 11px; color: #aaa; margin-bottom: 6px; }
    .status { text-align: center; padding: 20px; color: #888; font-size: 13px; }
    .err { color: #f55; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="title">Zygisk Mode Virtus V3</div>
      <div class="sub">Select apps to hook — Save then reboot</div>
      <input class="search" id="search" type="search" placeholder="Search apps..." />
    </div>
    <div class="list-wrap">
      <div id="status" class="status">Loading apps...</div>
      <div id="list"></div>
    </div>
    <div class="bar">
      <div class="count" id="count">0 selected</div>
      <button class="btn" id="save">Save</button>
    </div>
  </div>
  <script>
    const TARGET = '/data/adb/modules/zygisk_floating_menu/target_packages.txt';
    const BLOCKED = new Set([
      'android', 'me.weishu.kernelsu', 'com.vvb2060.kernelsu', 'com.rifsxd.ksunext',
      'me.rifsxds.ksunext', 'com.sukisu.ultra', 'com.topjohnwu.magisk', 'me.bmax.apatch',
      'io.github.mmrl', 'com.dergoogler.mmrl', 'com.dergoogler.mmrl.wx',
      'com.android.systemui', 'com.android.vending', 'com.google.android.gms',
      'com.android.settings', 'com.google.android.gsf'
    ]);
    let selected = new Set();
    let allApps = [];
    let rootApi = null;

    function apis() {
      const out = [];
      if (typeof ksu !== 'undefined') out.push(ksu);
      if (typeof sukisu !== 'undefined') out.push(sukisu);
      if (typeof apatch !== 'undefined') out.push(apatch);
      if (typeof magisk !== 'undefined') out.push(magisk);
      if (typeof mmrl !== 'undefined') out.push(mmrl);
      return out;
    }

    function api() {
      if (!rootApi) {
        const list = apis();
        rootApi = list.length ? list[0] : null;
      }
      return rootApi;
    }

    function iconPrefix() {
      if (typeof ksu !== 'undefined') return 'ksu://icon/';
      if (typeof sukisu !== 'undefined') return 'ksu://icon/';
      if (typeof apatch !== 'undefined') return 'apatch://icon/';
      if (typeof magisk !== 'undefined') return 'magisk://icon/';
      if (typeof mmrl !== 'undefined') return 'mmrl://icon/';
      return 'ksu://icon/';
    }

    function stdoutOf(out) {
      if (out == null) return '';
      if (typeof out === 'string') {
        try {
          const j = JSON.parse(out);
          if (j && j.stdout != null) return String(j.stdout);
          if (Array.isArray(j)) return out;
        } catch (e) {}
        return out;
      }
      if (out.stdout != null) return String(out.stdout);
      if (out.errno === 0 && out.stdout != null) return String(out.stdout);
      return String(out);
    }

    async function execCmd(cmd) {
      const a = api();
      if (!a || !a.exec) throw new Error('Open from SukiSU module WebUI button');
      let r = a.exec(cmd);
      if (r && typeof r.then === 'function') r = await r;
      if (typeof r === 'string') {
        try { r = JSON.parse(r); } catch (e) {}
      }
      return stdoutOf(r);
    }

    function execSync(cmd) {
      const a = api();
      if (!a || !a.exec) throw new Error('Open from SukiSU module WebUI button');
      return stdoutOf(a.exec(cmd));
    }

    function toast(m) {
      try { const a = api(); if (a && a.toast) { a.toast(m); return; } } catch (e) {}
    }

    function pkgName(p) {
      if (!p) return '';
      if (typeof p === 'string') return p.trim();
      return String(p.packageName || p.package || p.pkg || p.name || '').trim();
    }

    function labelOf(p, fallback) {
      if (typeof p === 'object' && p) {
        return String(p.appLabel || p.label || p.applicationLabel || fallback || pkgName(p)).trim();
      }
      return fallback || pkgName(p);
    }

    function parseAny(raw) {
      if (raw == null) return [];
      if (Array.isArray(raw)) {
        return raw.map(x => pkgName(x)).filter(Boolean);
      }
      if (typeof raw === 'object') {
        if (raw.packageName || raw.package || raw.pkg) return [pkgName(raw)];
        if (raw.data && Array.isArray(raw.data)) return parseAny(raw.data);
        if (raw.packages && Array.isArray(raw.packages)) return parseAny(raw.packages);
        if (raw.list && Array.isArray(raw.list)) return parseAny(raw.list);
        return Object.values(raw).map(pkgName).filter(Boolean);
      }
      if (typeof raw === 'string') {
        const s = raw.trim();
        if (!s) return [];
        if (s.charAt(0) === '[' || s.charAt(0) === '{') {
          try { return parseAny(JSON.parse(s)); } catch (e) {}
        }
        return s.split('\n').map(l => l.replace(/^package:/, '').trim()).filter(Boolean);
      }
      return [];
    }

    function okPkg(p) {
      if (!p || BLOCKED.has(p)) return false;
      if (p === '*') return false;
      if (p.startsWith('com.android.') && p !== 'com.android.chrome') return false;
      return true;
    }

    function uniq(arr) {
      return [...new Set(arr.filter(okPkg))];
    }

    async function callListAsync(fn) {
      try {
        let raw = fn();
        if (raw && typeof raw.then === 'function') raw = await raw;
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (e) {}
        }
        return uniq(parseAny(raw));
      } catch (e) {
        return [];
      }
    }

    async function listFromShell() {
      const cmds = [
        'pm list packages -3',
        'pm list packages -3 -u',
        'cmd package list packages --user 0 -3',
        'pm list packages -e -3'
      ];
      let best = [];
      for (const cmd of cmds) {
        let out = '';
        try { out = await execCmd(cmd + ' 2>/dev/null'); } catch (e) {}
        const pkgs = uniq(parseAny(out));
        if (pkgs.length > best.length) best = pkgs;
        if (best.length >= 5) break;
      }
      return best;
    }

    async function listFromApi() {
      let merged = [];
      for (const a of apis()) {
        if (a.listPackages) {
          for (const t of ['user', 'all']) {
            const pkgs = await callListAsync(() => a.listPackages(t));
            merged = uniq([...merged, ...pkgs]);
          }
        }
        for (const fn of ['listUserPackages', 'listUserApps', 'listApps', 'listAllPackages']) {
          if (!a[fn]) continue;
          const pkgs = await callListAsync(() => a[fn]());
          merged = uniq([...merged, ...pkgs]);
        }
      }
      return merged;
    }

    async function listPackages() {
      // Shell pm list is most reliable on SukiSU (API often returns 1 wrong app)
      let pkgs = await listFromShell();
      const apiPkgs = await listFromApi();
      pkgs = uniq([...pkgs, ...apiPkgs]);
      return pkgs;
    }

    function getLabels(pkgs) {
      const map = {};
      const a = api();
      if (a && a.getPackagesInfo) {
        for (let i = 0; i < pkgs.length; i += 80) {
          const batch = pkgs.slice(i, i + 80);
          try {
            let info = null;
            try { info = a.getPackagesInfo(JSON.stringify(batch)); } catch (e1) {
              try { info = a.getPackagesInfo(batch); } catch (e2) {}
            }
            if (typeof info === 'string') {
              try { info = JSON.parse(info); } catch (e) {}
            }
            if (Array.isArray(info)) {
              info.forEach(p => {
                const n = pkgName(p);
                if (n) map[n] = labelOf(p, n);
              });
            }
          } catch (e) {}
        }
      }
      pkgs.forEach(p => { if (!map[p]) map[p] = p; });
      return map;
    }

    function loadSelected() {
      try {
        const t = execSync('cat "' + TARGET + '" 2>/dev/null || true');
        selected.clear();
        (t || '').split('\n').forEach(l => {
          l = l.trim();
          if (l && l !== '*' && okPkg(l)) selected.add(l);
        });
      } catch (e) {}
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('list');
      list.innerHTML = '';
      allApps.filter(a => !q || a.label.toLowerCase().includes(q) || a.pkg.includes(q)).forEach(app => {
        const row = document.createElement('div');
        row.className = 'row' + (selected.has(app.pkg) ? ' selected' : '');
        row.onclick = () => {
          if (selected.has(app.pkg)) selected.delete(app.pkg); else selected.add(app.pkg);
          document.getElementById('count').textContent = selected.size + ' selected';
          render();
        };
        const img = document.createElement('img');
        img.src = iconPrefix() + encodeURIComponent(app.pkg);
        img.onerror = () => { img.style.visibility = 'hidden'; };
        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = '<div class="name">' + app.label + '</div><div class="pkg">' + app.pkg + '</div>';
        const dot = document.createElement('div');
        dot.className = 'dot';
        row.appendChild(img);
        row.appendChild(info);
        row.appendChild(dot);
        list.appendChild(row);
      });
      document.getElementById('status').style.display = 'none';
    }

    function save() {
      const lines = [...selected].filter(p => okPkg(p) && p !== '*');
      execSync('mkdir -p /data/adb/modules/zygisk_floating_menu');
      if (!lines.length) {
        execSync(': > "' + TARGET + '"');
      } else {
        execSync("cat > '" + TARGET + "' << 'EOF'\n" + lines.join('\n') + "\nEOF");
      }
      execSync('chmod 644 "' + TARGET + '"');
      execSync('grep -vx "\\*" "' + TARGET + '" > "' + TARGET + '.tmp" 2>/dev/null && mv "' + TARGET + '.tmp" "' + TARGET + '" || true');
      toast('Saved. Reboot phone.');
      document.getElementById('count').textContent = lines.length + ' saved — reboot';
    }

    async function boot() {
      try {
        const a = api();
        if (a && a.fullScreen) a.fullScreen(false);
        loadSelected();
        const pkgs = await listPackages();
        const labels = getLabels(pkgs);
        allApps = pkgs.map(p => ({ pkg: p, label: labels[p] || p }));
        allApps.sort((x, y) => x.label.localeCompare(y.label));
        document.getElementById('count').textContent = selected.size + ' selected · ' + allApps.length + ' apps';
        if (!allApps.length) {
          document.getElementById('status').className = 'status err';
          document.getElementById('status').textContent = 'No apps found — grant root to WebUI';
        } else {
          render();
        }
      } catch (e) {
        document.getElementById('status').className = 'status err';
        document.getElementById('status').textContent = e.message || String(e);
      }
    }

    document.getElementById('search').oninput = render;
    document.getElementById('save').onclick = save;
    boot();
  </script>
</body>
</html>
