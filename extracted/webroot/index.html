<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select Apps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; }
    body {
      font-family: sans-serif;
      color: #eee;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      width: 100%;
      max-height: 50vh;
      background: #141418;
      border-radius: 14px 14px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .head { padding: 12px 14px 8px; border-bottom: 1px solid #2a2a30; flex-shrink: 0; }
    .title { color: #c41e3a; font-size: 16px; font-weight: 700; }
    .search {
      width: 100%; margin-top: 8px; padding: 10px 12px;
      border-radius: 8px; border: 1px solid #333; background: #1c1c22;
      color: #fff; font-size: 14px;
    }
    .list-wrap { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; margin-bottom: 6px; border-radius: 10px;
      background: #1c1c22; border: 2px solid transparent;
    }
    .row.selected { border-color: #c41e3a; background: rgba(196,30,58,0.2); }
    .row img { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .pkg { font-size: 10px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #666; flex-shrink: 0; }
    .row.selected .dot { background: #c41e3a; border-color: #c41e3a; }
    .bar { padding: 10px 14px 14px; border-top: 1px solid #2a2a30; flex-shrink: 0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #c41e3a; color: #fff; font-size: 15px; font-weight: 700; }
    .count { text-align: center; font-size: 11px; color: #aaa; margin-bottom: 6px; }
    .status { text-align: center; padding: 20px; color: #888; font-size: 13px; }
    .err { color: #f55; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="head">
      <div class="title">Select Hook Apps</div>
      <input class="search" id="search" type="search" placeholder="Search" />
    </div>
    <div class="list-wrap">
      <div id="status" class="status">Loading...</div>
      <div id="list"></div>
    </div>
    <div class="bar">
      <div class="count" id="count">0 selected</div>
      <button class="btn" id="save">Save</button>
    </div>
  </div>
  <script>
    const TARGET = '/data/adb/modules/zygisk_floating_menu/target_packages.txt';
    const BLOCKED = new Set([
      'android', 'me.weishu.kernelsu', 'com.vvb2060.kernelsu', 'com.rifsxd.ksunext',
      'me.rifsxds.ksunext', 'com.sukisu.ultra', 'com.topjohnwu.magisk', 'me.bmax.apatch',
      'io.github.mmrl', 'com.dergoogler.mmrl', 'bin.mt.plus', 'bin.mt.plus.canary',
      'com.android.systemui', 'com.android.settings', 'com.android.launcher3', 'com.miui.home'
    ]);
    let selected = new Set();
    let allApps = [];
    let rootApi = null;

    function api() {
      if (!rootApi) {
        if (typeof ksu !== 'undefined') rootApi = ksu;
        else if (typeof sukisu !== 'undefined') rootApi = sukisu;
        else if (typeof apatch !== 'undefined') rootApi = apatch;
        else if (typeof magisk !== 'undefined') rootApi = magisk;
        else if (typeof mmrl !== 'undefined') rootApi = mmrl;
      }
      return rootApi;
    }

    function iconPrefix() {
      if (typeof sukisu !== 'undefined') return 'sukisu://icon/';
      if (typeof apatch !== 'undefined') return 'apatch://icon/';
      if (typeof magisk !== 'undefined') return 'magisk://icon/';
      if (typeof mmrl !== 'undefined') return 'mmrl://icon/';
      return 'ksu://icon/';
    }

    function exec(cmd) {
      const a = api();
      if (!a || !a.exec) throw new Error('Open from root manager module page');
      const out = a.exec(cmd);
      if (typeof out === 'string') {
        try {
          const parsed = JSON.parse(out);
          if (parsed && parsed.stdout != null) return parsed.stdout;
        } catch (e) {}
        return out;
      }
      return (out && out.stdout != null) ? out.stdout : '';
    }

    function toast(m) {
      try { const a = api(); if (a && a.toast) { a.toast(m); return; } } catch (e) {}
    }

    function parsePkgJson(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string') {
        try { return JSON.parse(raw); } catch (e) { return []; }
      }
      return [];
    }

    function okPkg(p) {
      if (!p || BLOCKED.has(p)) return false;
      if (p.indexOf('.overlay') >= 0) return false;
      if (p.indexOf('overlay.') >= 0) return false;
      if (/\.overlay\./.test(p)) return false;
      if (p.indexOf('com.android.') === 0) return false;
      if (p.indexOf('com.google.android.') === 0) return false;
      if (p.indexOf('com.motorola.') === 0 && p.indexOf('overlay') >= 0) return false;
      return true;
    }

    function uniq(arr) {
      return [...new Set(arr)];
    }

    function fromShellList(out) {
      return (out || '').split('\n')
        .map(l => l.replace(/^package:/, '').trim())
        .filter(okPkg);
    }

    function listPackages() {
      const a = api();
      if (a) {
        try {
          if (typeof a.listUserPackages === 'function') {
            const pkgs = parsePkgJson(a.listUserPackages())
              .map(p => (typeof p === 'string' ? p : (p && p.packageName) || ''))
              .filter(okPkg);
            if (pkgs.length) return uniq(pkgs);
          }
        } catch (e) {}
        try {
          if (typeof a.listPackages === 'function') {
            let raw = a.listPackages('user');
            const pkgs = parsePkgJson(raw)
              .map(p => (typeof p === 'string' ? p : (p && p.packageName) || ''))
              .filter(okPkg);
            if (pkgs.length) return uniq(pkgs);
          }
        } catch (e) {}
      }

      let pkgs = fromShellList(exec('pm list packages -3 2>/dev/null'));
      if (pkgs.length) return uniq(pkgs);

      pkgs = fromShellList(exec('cmd package list packages -3 2>/dev/null'));
      if (pkgs.length) return uniq(pkgs);

      pkgs = fromShellList(exec('pm list packages -3 -u 2>/dev/null'));
      if (pkgs.length) return uniq(pkgs);

      pkgs = fromShellList(exec('pm list packages 2>/dev/null')).filter(p => {
        return p.indexOf('com.android.') !== 0 && p.indexOf('com.google.android.') !== 0;
      });
      return uniq(pkgs);
    }

    function getLabels(pkgs) {
      const map = {};
      const a = api();
      if (a && a.getPackagesInfo) {
        for (let i = 0; i < pkgs.length; i += 80) {
          const batch = pkgs.slice(i, i + 80);
          try {
            let info = null;
            try { info = a.getPackagesInfo(JSON.stringify(batch)); } catch (e1) {
              try { info = a.getPackagesInfo(batch); } catch (e2) {}
            }
            const arr = parsePkgJson(info);
            arr.forEach(p => {
              if (p && p.packageName) map[p.packageName] = p.appLabel || p.label || p.packageName;
            });
          } catch (e) {}
        }
      }
      pkgs.forEach(p => { if (!map[p]) map[p] = p; });
      return map;
    }

    function loadSelected() {
      try {
        const t = exec('cat "' + TARGET + '" 2>/dev/null || true');
        selected.clear();
        (t || '').split('\n').forEach(l => {
          l = l.trim();
          if (l && l !== '*' && okPkg(l)) selected.add(l);
        });
      } catch (e) {}
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('list');
      list.innerHTML = '';
      allApps.filter(a => !q || a.label.toLowerCase().includes(q) || a.pkg.includes(q)).forEach(app => {
        const row = document.createElement('div');
        row.className = 'row' + (selected.has(app.pkg) ? ' selected' : '');
        row.onclick = () => {
          if (selected.has(app.pkg)) selected.delete(app.pkg); else selected.add(app.pkg);
          document.getElementById('count').textContent = selected.size + ' selected';
          render();
        };
        const img = document.createElement('img');
        img.src = iconPrefix() + encodeURIComponent(app.pkg);
        img.onerror = () => { img.style.visibility = 'hidden'; };
        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = '<div class="name">' + app.label + '</div><div class="pkg">' + app.pkg + '</div>';
        const dot = document.createElement('div');
        dot.className = 'dot';
        row.appendChild(img);
        row.appendChild(info);
        row.appendChild(dot);
        list.appendChild(row);
      });
      document.getElementById('status').style.display = 'none';
    }

    function save() {
      const lines = [...selected].filter(p => okPkg(p) && p !== '*');
      exec('mkdir -p /data/adb/modules/zygisk_floating_menu');
      if (!lines.length) {
        exec(': > "' + TARGET + '"');
      } else {
        const body = lines.join('\n');
        exec("cat > '" + TARGET + "' << 'EOF'\n" + body + "\nEOF");
      }
      exec('chmod 644 "' + TARGET + '"');
      exec('grep -vx "\\*" "' + TARGET + '" > "' + TARGET + '.tmp" 2>/dev/null && mv "' + TARGET + '.tmp" "' + TARGET + '" || true');
      toast('Saved. Reboot.');
      document.getElementById('count').textContent = lines.length + ' saved — reboot';
    }

    try {
      const a = api();
      if (a && a.fullScreen) a.fullScreen(false);
      loadSelected();
      const pkgs = listPackages();
      const labels = getLabels(pkgs);
      allApps = pkgs.map(p => ({ pkg: p, label: labels[p] || p }));
      allApps.sort((x, y) => x.label.localeCompare(y.label));
      document.getElementById('count').textContent = selected.size + ' selected';
      if (!allApps.length) {
        document.getElementById('status').className = 'status err';
        document.getElementById('status').textContent = 'No apps found';
      } else {
        render();
      }
    } catch (e) {
      document.getElementById('status').className = 'status err';
      document.getElementById('status').textContent = e.message || String(e);
    }

    document.getElementById('search').oninput = render;
    document.getElementById('save').onclick = save;
  </script>
</body>
</html>
